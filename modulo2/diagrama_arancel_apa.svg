<svg width="100%" viewBox="0 0 680 580" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Estructura del arancel de acreditación para laboratorios de anatomía patológica</title>
  <desc>Diagrama que muestra el valor del arancel (140 UTM), su división en dos cuotas, los plazos de pago, los recargos aplicables y los aranceles en casos especiales como plan de corrección</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- === HEADER: Valor total === -->
  <rect x="160" y="20" width="360" height="64" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
  <text x="340" y="46" font-family="sans-serif" font-size="12" fill="#0C447C" text-anchor="middle">Laboratorio de anatomía patológica y citología</text>
  <text x="340" y="65" font-family="sans-serif" font-size="18" font-weight="500" fill="#0C447C" text-anchor="middle">Arancel total: 140 UTM</text>
  <text x="490" y="46" font-family="sans-serif" font-size="10" fill="#185FA5" text-anchor="middle" font-style="italic">Atención abierta · baja complejidad</text>
  <text x="490" y="58" font-family="sans-serif" font-size="10" fill="#185FA5" text-anchor="middle" font-style="italic">D.E. N°68 · 12-oct-2022</text>

  <!-- Arrow down -->
  <line x1="340" y1="84" x2="340" y2="112" stroke="#B5D4F4" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="200" y1="112" x2="480" y2="112" stroke="#B5D4F4" stroke-width="0.5"/>
  <line x1="200" y1="112" x2="200" y2="132" stroke="#B5D4F4" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="480" y1="112" x2="480" y2="132" stroke="#B5D4F4" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- === CUOTA 1 === -->
  <rect x="80" y="136" width="240" height="100" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="200" y="158" font-family="sans-serif" font-size="13" font-weight="500" fill="#085041" text-anchor="middle">1ª cuota — 70 UTM (50%)</text>
  <text x="200" y="176" font-family="sans-serif" font-size="11" fill="#0F6E56" text-anchor="middle">Se paga a la Entidad Acreditadora</text>
  <rect x="92" y="186" width="216" height="36" rx="5" fill="#085041" fill-opacity="0.08"/>
  <text x="200" y="200" font-family="sans-serif" font-size="11" fill="#085041" text-anchor="middle" font-weight="500">Plazo: 10 días hábiles</text>
  <text x="200" y="215" font-family="sans-serif" font-size="10" fill="#0F6E56" text-anchor="middle">desde la notificación de aceptación de la EA</text>

  <!-- === CUOTA 2 === -->
  <rect x="360" y="136" width="240" height="100" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="480" y="158" font-family="sans-serif" font-size="13" font-weight="500" fill="#3C3489" text-anchor="middle">2ª cuota — 70 UTM (50%)</text>
  <text x="480" y="176" font-family="sans-serif" font-size="11" fill="#534AB7" text-anchor="middle">Se paga a la Entidad Acreditadora</text>
  <rect x="372" y="186" width="216" height="36" rx="5" fill="#534AB7" fill-opacity="0.08"/>
  <text x="480" y="200" font-family="sans-serif" font-size="11" fill="#3C3489" text-anchor="middle" font-weight="500">Plazo: 5 días hábiles</text>
  <text x="480" y="215" font-family="sans-serif" font-size="10" fill="#534AB7" text-anchor="middle">desde la notificación de la Resolución Exenta</text>

  <!-- Consequences below cuotas -->
  <rect x="80" y="248" width="240" height="36" rx="5" fill="#FCEBEB" stroke="#E24B4A" stroke-width="0.5"/>
  <text x="200" y="263" font-family="sans-serif" font-size="10" fill="#791F1F" text-anchor="middle" font-weight="500">Si no paga en plazo →</text>
  <text x="200" y="277" font-family="sans-serif" font-size="10" fill="#A32D2D" text-anchor="middle">Desistimiento automático del proceso</text>

  <rect x="360" y="248" width="240" height="36" rx="5" fill="#FCEBEB" stroke="#E24B4A" stroke-width="0.5"/>
  <text x="480" y="263" font-family="sans-serif" font-size="10" fill="#791F1F" text-anchor="middle" font-weight="500">Si no paga en plazo →</text>
  <text x="480" y="277" font-family="sans-serif" font-size="10" fill="#A32D2D" text-anchor="middle">Sin inscripción en Registro · sin nuevas solicitudes</text>

  <!-- Divider -->
  <line x1="60" y1="306" x2="620" y2="306" stroke="#D3D1C7" stroke-width="0.5" stroke-dasharray="4 3"/>
  <text x="340" y="320" font-family="sans-serif" font-size="11" fill="#888780" text-anchor="middle">Recargos y aranceles en situaciones especiales</text>

  <!-- === RECARGO DISTANCIA === -->
  <rect x="60" y="332" width="180" height="80" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
  <text x="150" y="352" font-family="sans-serif" font-size="12" font-weight="500" fill="#633806" text-anchor="middle">Recargo distancia</text>
  <text x="150" y="369" font-family="sans-serif" font-size="20" font-weight="500" fill="#854F0B" text-anchor="middle">+ 40 UTM</text>
  <text x="150" y="387" font-family="sans-serif" font-size="10" fill="#854F0B" text-anchor="middle">Si distancia &gt;150 km entre</text>
  <text x="150" y="400" font-family="sans-serif" font-size="10" fill="#854F0B" text-anchor="middle">prestador y sede más cercana EA</text>

  <!-- === PLAN CORRECCIÓN === -->
  <rect x="260" y="332" width="200" height="80" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text x="360" y="352" font-family="sans-serif" font-size="12" font-weight="500" fill="#712B13" text-anchor="middle">Plan de corrección</text>
  <text x="360" y="372" font-family="sans-serif" font-size="20" font-weight="500" fill="#993C1D" text-anchor="middle">35 UTM</text>
  <text x="360" y="389" font-family="sans-serif" font-size="10" fill="#993C1D" text-anchor="middle">¼ del arancel original · solo</text>
  <text x="360" y="402" font-family="sans-serif" font-size="10" fill="#993C1D" text-anchor="middle">características comprometidas</text>

  <!-- === DEVOLUCIÓN EA === -->
  <rect x="480" y="332" width="180" height="80" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
  <text x="570" y="352" font-family="sans-serif" font-size="12" font-weight="500" fill="#27500A" text-anchor="middle">Devolución EA</text>
  <text x="570" y="372" font-family="sans-serif" font-size="20" font-weight="500" fill="#3B6D11" text-anchor="middle">5 días háb.</text>
  <text x="570" y="389" font-family="sans-serif" font-size="10" fill="#3B6D11" text-anchor="middle">Si proceso declarado desierto</text>
  <text x="570" y="402" font-family="sans-serif" font-size="10" fill="#3B6D11" text-anchor="middle">por incumplimiento de la EA</text>

  <!-- Divider 2 -->
  <line x1="60" y1="432" x2="620" y2="432" stroke="#D3D1C7" stroke-width="0.5" stroke-dasharray="4 3"/>
  <text x="340" y="446" font-family="sans-serif" font-size="11" fill="#888780" text-anchor="middle">Tabla de aranceles comparativa — estándares generales (DS 15/2007, Art. 35)</text>

  <!-- Comparison table -->
  <!-- Headers -->
  <rect x="60" y="454" width="200" height="26" rx="4" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
  <rect x="262" y="454" width="130" height="26" rx="4" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
  <rect x="394" y="454" width="130" height="26" rx="4" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
  <rect x="526" y="454" width="134" height="26" rx="4" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="160" y="472" font-family="sans-serif" font-size="11" font-weight="500" fill="#5F5E5A" text-anchor="middle">Tipo de prestador</text>
  <text x="327" y="472" font-family="sans-serif" font-size="11" font-weight="500" fill="#5F5E5A" text-anchor="middle">Baja</text>
  <text x="459" y="472" font-family="sans-serif" font-size="11" font-weight="500" fill="#5F5E5A" text-anchor="middle">Mediana</text>
  <text x="593" y="472" font-family="sans-serif" font-size="11" font-weight="500" fill="#5F5E5A" text-anchor="middle">Alta</text>

  <!-- Row 1: Atención Cerrada -->
  <text x="160" y="498" font-family="sans-serif" font-size="11" fill="#444441" text-anchor="middle">Atención cerrada</text>
  <text x="327" y="498" font-family="sans-serif" font-size="11" fill="#444441" text-anchor="middle">150 UTM</text>
  <text x="459" y="498" font-family="sans-serif" font-size="11" fill="#444441" text-anchor="middle">200 UTM</text>
  <text x="593" y="498" font-family="sans-serif" font-size="11" fill="#444441" text-anchor="middle">300 UTM</text>
  <line x1="60" y1="506" x2="660" y2="506" stroke="#D3D1C7" stroke-width="0.5"/>

  <!-- Row 2: Atención Abierta -->
  <text x="160" y="524" font-family="sans-serif" font-size="11" fill="#444441" text-anchor="middle">Atención abierta</text>
  <text x="327" y="524" font-family="sans-serif" font-size="11" fill="#444441" text-anchor="middle">140 UTM</text>
  <text x="459" y="524" font-family="sans-serif" font-size="11" fill="#444441" text-anchor="middle">160 UTM</text>
  <text x="593" y="524" font-family="sans-serif" font-size="11" fill="#444441" text-anchor="middle">180 UTM</text>
  <line x1="60" y1="532" x2="660" y2="532" stroke="#D3D1C7" stroke-width="0.5"/>

  <!-- Row 3: AP highlighted -->
  <rect x="60" y="534" width="600" height="28" rx="4" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="160" y="552" font-family="sans-serif" font-size="11" font-weight="500" fill="#0C447C" text-anchor="middle">Anatomía patológica ★</text>
  <text x="327" y="552" font-family="sans-serif" font-size="11" font-weight="500" fill="#185FA5" text-anchor="middle">140 UTM</text>
  <text x="459" y="552" font-family="sans-serif" font-size="11" fill="#185FA5" text-anchor="middle">—</text>
  <text x="593" y="552" font-family="sans-serif" font-size="11" fill="#185FA5" text-anchor="middle">—</text>

  <!-- Footer note -->
  <text x="340" y="576" font-family="sans-serif" font-size="10" fill="#888780" text-anchor="middle">★ Clasificados como atención abierta baja complejidad por D.E. N°68/2022 del MINSAL · independiente de la complejidad técnica del laboratorio</text>
</svg>
